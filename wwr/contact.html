<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Splash White Water Rafting</title>

    <meta name="description"
      content="Contact Splash White Water Rafting for trip reservations, general inquiries, website feedback, and information about our exciting rafting adventures.">

    <meta name="author" content="Bryan Alex Bravo Medina">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="header-content">
            <img src="images/logo.png" alt="Splash White Water Rafting company logo">
            <nav>
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>

            <div class="company-details">
                <p><strong>Address:</strong> 123 River Adventure Road, Colorado Springs, CO 80903
                </p>
                <p><strong>Phone:</strong> (555) 123-4567</p>
                <p><strong>Email:</strong> info@splashrafting.com</p>
            </div>

            <div class="extra-content">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d19299.596028524415!2d-49.59362119115328!3d-21.41239679732039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sbr!4v1780449118492!5m2!1ses!2sbr"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset>
                        <legend>Purpose of Message</legend>

                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We are here to serve you</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee-01.jpg" alt="Sarah Johnson - Operations Manager">
                    <figcaption>Sarah Johnson — Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-02.jpg" alt="Michael Torres - Lead River Guide">
                    <figcaption>Michael Torres — Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-03.jpg" alt="Emma Carter - Customer Service Manager">
                    <figcaption>Emma Carter — Customer Service Manager</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <div class="footer-content">
            <p>© 2026 - Splash White Water Rafting - Bryan Alex Bravo Medina</p>
            <nav class="socialmedia">
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                    <img src="images/facebook.png" alt="Facebook Icon">
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                    <img src="images/instagram.png" alt="Instagram Icon">
                </a>
                <a href="https://pinterest.com" target="_blank" rel="noopener noreferrer">
                    <img src="images/pinterest.png" alt="Pinterest Icon">
                </a>
            </nav>
        </div>
    </footer>
</body>

</html>
