<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll</title>

    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <header>
        <h1>User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" name="fullname" id="fullname" placeholder="John Smith"
                      required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" name="useremail" id="useremail"
                      placeholder="john@example.com" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Preferences</legend>

                <div class="form-item">
                    <p>What is your favorite browser?</p>

                    <label>
                        <input type="radio" name="browser" value="chrome">
                        Chrome
                    </label>

                    <label>
                        <input type="radio" name="browser" value="firefox">
                        Firefox
                    </label>

                    <label>
                        <input type="radio" name="browser" value="brave">
                        Brave
                    </label>
                </div>

                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" name="pet" id="pet">
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>

                <div class="form-item">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="10"
                      placeholder="Stillwater, Florida; Amsterdam, Netherlands; Timbuktu, Mali"></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy | 2026 User Poll Exercise | Bryan Bravo</p>
    </footer>

</body>

</html>
