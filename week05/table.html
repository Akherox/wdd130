<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Conference Table</title>

    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <caption>Basketball Conference Statistics</caption>
        <thead>
            <tr>
                <th>Conference</th>
                <th>Team</th>
                <th>City</th>
                <th>Players</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Southern</th>
                <td>Tigers</td>
                <td>Atlanta</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Sharks</td>
                <td>Miami</td>
                <td>14</td>
            </tr>

            <tr>
                <th rowspan="2">Western</th>
                <td>Wolves</td>
                <td>Phoenix</td>
                <td>16</td>
            </tr>
            <tr>
                <td>Eagles</td>
                <td>Denver</td>
                <td>17</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total Players</th>
                <td>62</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
